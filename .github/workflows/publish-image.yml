# Publishes the template as a base image. Agent repositories build FROM it and
# add only their own agent/ directory, so the bot's code exists once.
#
# The image is architecture-specific: since v0.3 the agent SDK ships the Claude
# Code CLI as a native binary picked for the build platform. Build for the
# architectures you deploy on and no others - each one carries ~290MB.
name: Publish base image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "mcp/**"
      - "deployment/Dockerfile"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Required for linux/arm64: the runner is amd64, and the SDK's native
      # binary is selected per platform at install time.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
