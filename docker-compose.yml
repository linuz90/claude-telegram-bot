services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # The SDK spawns child processes; init reaps them instead of leaving zombies.
    init: true
    volumes:
      # Session, audit log and downloads. Without this /resume forgets
      # everything on redeploy.
      - bot-state:/data
      # The agent's working files. Point this at whatever the agent manages.
      - ./workspace:/workspace

volumes:
  bot-state:
